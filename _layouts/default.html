<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}">文章</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/xuaniyan1" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.title }} · 由 Obsidian 与 GitHub Pages 驱动</footer>
  </body>
</html>
