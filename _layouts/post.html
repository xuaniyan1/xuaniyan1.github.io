---
layout: default
---
<article class="article">
  <header class="article-header">
    <p class="post-meta">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
    {% if page.tags.size > 0 %}<div class="tags">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="article-content">{{ content }}</div>
</article>
