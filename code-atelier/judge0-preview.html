const wandboxRunPatch = "async function wandboxRun(data,signal){\n const tests=data.action==='run'?[{input:data.stdin,expected:''}]:current.tests;\n if(!tests.length)return {status:'FAILED',passed:0,total:0,results:[]};\n if(data.action==='run')return await wandboxCompileRun(data.code,tests[0].input,data.language,signal);\n if(signal.aborted)throw new DOMException('已停止运行。','AbortError');\n const started=performance.now();\n const normalizeOutput=s=>String(s??'').trim().split(/\\s+/).filter(Boolean).join('\\0');\n const results=new Array(tests.length);\n const batchController=new AbortController();\n const abortBatch=()=>batchController.abort();\n signal.addEventListener('abort',abortBatch,{once:true});\n try{\n  const first=await wandboxCompileRun(data.code,tests[0].input,data.language,batchController.signal);\n  if(first.status==='CE')return {status:'CE',message:'编译失败 · '+(first.stderr||'请检查代码。'),stderr:first.stderr,results:[]};\n  if(first.status==='OK')first.status=normalizeOutput(first.stdout)===normalizeOutput(tests[0].expected)?'AC':'WA';\n  results[0]={...first,index:1,input:tests[0].input,expected:tests[0].expected};\n  let completed=1,next=1,compileError=null;\n  $('judgeSummary').textContent='已完成 1 / '+tests.length+' 组测试，正在并行执行剩余测试…';\n  const runNext=async()=>{\n   while(true){\n    if(batchController.signal.aborted)throw new DOMException('已停止运行。','AbortError');\n    if(compileError)return;\n    const i=next++;\n    if(i>=tests.length)return;\n    $('judgeSummary').textContent='已完成 '+completed+' / '+tests.length+'，正在运行测试 '+(i+1)+'…';\n    const r=await wandboxCompileRun(data.code,tests[i].input,data.language,batchController.signal);\n    if(r.status==='CE'){compileError=r;return;}\n    if(r.status==='OK')r.status=normalizeOutput(r.stdout)===normalizeOutput(tests[i].expected)?'AC':'WA';\n    results[i]={...r,index:i+1,input:tests[i].input,expected:tests[i].expected};\n    completed++;\n    $('judgeSummary').textContent='已完成 '+completed+' / '+tests.length+' 组测试…';\n   }\n  };\n  const concurrency=Math.min(3,Math.max(0,tests.length-1));\n  await Promise.all(Array.from({length:concurrency},()=>runNext()));\n  if(compileError)return {status:'CE',message:'编译失败 · '+(compileError.stderr||'请检查代码。'),stderr:compileError.stderr,results:[]};\n  const passed=results.filter(x=>x.status==='AC').length;\n  return {status:passed===results.length?'AC':'FAILED',passed,total:results.length,results,elapsedMs:Math.round(performance.now()-started)};\n }catch(e){\n  batchController.abort();\n  throw e;\n }finally{\n  signal.removeEventListener('abort',abortBatch);\n }\n}";
const wandboxRunPattern = /async function wandboxRun\(data,signal\)\{[\s\S]*?\n\}\n\nfunction browserRun/;
if(!wandboxRunPattern.test(pack.js))throw new Error('测评优化补丁未匹配到 Wandbox 执行函数。');
pack.js=pack.js.replace(wandboxRunPattern,wandboxRunPatch+'\n\nfunction browserRun');
const rawFlagOld = "body['compiler-option-raw']='-std='+(lang==='c'?'c11':'c++17')+' -O2 -Wall -Wextra';";
const rawFlagNew = "body['compiler-option-raw']=['-std='+(lang==='c'?'c11':'c++17'),'-O2','-Wall','-Wextra'].join('\\n');";
if(!pack.js.includes(rawFlagOld))throw new Error('测评优化补丁未匹配到编译参数。');

const warmFunction = "function warmExecutionEngine(){\n if(active)return;\n if(language==='py'){\n  if(!worker)worker=new Worker(window.__ATELIER_WORKER_URL__);\n  if(worker.__atelierWarmupStarted)return;\n  worker.__atelierWarmupStarted=true;\n  worker.onmessage=({data:m})=>{\n   if(m.type==='loading')$('engine').textContent='正在预热 Python 环境…';\n   if(m.type==='ready')engineLabel();\n   if(m.type==='error'){worker?.terminate();worker=null;}\n  };\n  worker.onerror=()=>{worker?.terminate();worker=null;};\n  worker.postMessage({type:'warmup'});\n }else{\n  getWandboxCompilers().catch(()=>{});\n }\n}";
if(!pack.js.includes('function browserRun(data){'))throw new Error('测评优化补丁未匹配到 Python 执行函数。');
pack.js=pack.js.replace('function browserRun(data){',warmFunction+'\nfunction browserRun(data){');
const oldLanguageChange = "$('language').onchange=()=>{remember();language=$('language').value;renderProblem();renderList()};";
const newLanguageChange = "$('language').onchange=()=>{remember();language=$('language').value;renderProblem();renderList();warmExecutionEngine()};";
if(!pack.js.includes(oldLanguageChange))throw new Error('测评优化补丁未匹配到语言切换事件。');
pack.js=pack.js.replace(oldLanguageChange,newLanguageChange);
const editorInputMarker = "$('editor').addEventListener('input',()=>{remember();lineNumbers()});";
if(!pack.js.includes(editorInputMarker))throw new Error('测评优化补丁未匹配到代码编辑器事件。');
pack.js=pack.js.replace(editorInputMarker,"$('editor').addEventListener('focus',warmExecutionEngine);\n"+editorInputMarker);
const workerOld = "let runtime;\nself.onmessage=async ({data})=>{\n try{\n  if(!runtime){self.postMessage({type:'loading'});importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');runtime=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});}\n  const results=[];";
const workerNew = "let runtime,runtimePromise;\nasync function ensureRuntime(){\n if(runtime)return runtime;\n if(!runtimePromise){\n  runtimePromise=(async()=>{\n   self.postMessage({type:'loading'});\n   importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');\n   runtime=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});\n   return runtime;\n  })().catch(e=>{runtimePromise=null;throw e});\n }\n return runtimePromise;\n}\nself.onmessage=async ({data})=>{\n try{\n  await ensureRuntime();\n  if(data.type==='warmup'){self.postMessage({type:'ready'});return;}\n  const results=[];\n  runtime.globals.set('_atelier_code',data.code);\n  const compileError=runtime.runPython([\n   'import traceback as _tb',\n   'try:',\n   \"    _atelier_compiled_code=compile(_atelier_code, 'main.py', 'exec')\",\n   \"    _atelier_compile_error=''\",\n   'except BaseException:',\n   '    _atelier_compiled_code=None',\n   '    _atelier_compile_error=_tb.format_exc()',\n   '_atelier_compile_error'\n  ].join('\\n'));\n  if(compileError){\n   self.postMessage({type:'done',result:{status:'CE',message:'Python 编译失败',stderr:String(compileError),passed:0,total:data.tests.length,results:[]}});\n   return;\n  }";
if(!pack.worker.includes(workerOld))throw new Error('测评优化补丁未匹配到 Python Worker 初始化代码。');
pack.worker=pack.worker.replace(workerOld,workerNew);
if(!pack.worker.includes("runtime.globals.set('_atelier_code',data.code);runtime.globals.set('_atelier_input',data.tests[i].input);"))throw new Error('测评优化补丁未匹配到 Python 测试代码。');
pack.worker=pack.worker.replace("runtime.globals.set('_atelier_code',data.code);runtime.globals.set('_atelier_input',data.tests[i].input);","runtime.globals.set('_atelier_input',data.tests[i].input);");
if(!pack.worker.includes("exec(compile(_atelier_code, 'main.py', 'exec'),"))throw new Error('测评优化补丁未匹配到 Python 执行入口。');
pack.worker=pack.worker.replace("exec(compile(_atelier_code, 'main.py', 'exec'),","exec(_atelier_compiled_code,");
document.body.innerHTML=pack.body;
const style=document.createElement('style');style.textContent=pack.css;document.head.appendChild(style);
window.__ATELIER_PROBLEMS_GZIP__=pack.problems;
window.__ATELIER_WORKER_URL__=URL.createObjectURL(new Blob([pack.worker],{type:'text/javascript'}));
const script=document.createElement('script');script.textContent=pack.js;document.body.appendChild(script);
})().catch(error=>{document.body.innerHTML='<main style="padding:2rem;font:16px sans-serif">页面加载失败：'+String(error)+'</main>';});
